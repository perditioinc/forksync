name: Nightly Fork Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run'
        type: boolean
        default: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync
        run: |
          curl --no-buffer -X POST ${{ secrets.FORKSYNC_SERVICE_URL }}/run \
            -H "Authorization: Bearer ${{ secrets.FORKSYNC_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"dry_run": ${{ inputs.dry_run || false }}}' \
            --max-time 900
