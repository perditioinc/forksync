name: Nightly Fork Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run'
        type: boolean
        default: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Trigger sync and capture output
        run: |
          curl --no-buffer -X POST ${{ secrets.FORKSYNC_SERVICE_URL }}/run \
            -H "Authorization: Bearer ${{ secrets.FORKSYNC_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"dry_run": ${{ inputs.dry_run || false }}}' \
            --max-time 900 \
            -o /tmp/sync_output.ndjson
          echo "Sync complete. Last lines:"
          tail -5 /tmp/sync_output.ndjson

      - name: Generate SYNC_REPORT.md
        if: ${{ inputs.dry_run != 'true' }}
        env:
          SYNC_DATE: ${{ github.run_started_at }}
        run: |
          python3 << 'EOF'
          import json, os, sys

          try:
              lines = open('/tmp/sync_output.ndjson').readlines()
          except FileNotFoundError:
              print("No sync output found — skipping report")
              sys.exit(0)

          # Find the summary line
          summary = {}
          for line in reversed(lines):
              line = line.strip()
              if not line:
                  continue
              try:
                  obj = json.loads(line)
                  if obj.get('msg') == 'sync complete':
                      summary = obj
                      break
              except json.JSONDecodeError:
                  continue

          if not summary:
              print("No summary line found in output — skipping report")
              sys.exit(0)

          duration = summary.get('duration_seconds', 0)
          synced = summary.get('synced', 0)
          checked = summary.get('checked', 0)
          errors = summary.get('errors', 0)
          skipped = summary.get('skipped_schedule', 0)

          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          date_str = now.strftime('%Y-%m-%d %H:%M UTC')
          date_short = now.strftime('%Y-%m-%d')

          if duration >= 60:
              mins = int(duration // 60)
              secs = int(duration % 60)
              dur_str = f'{mins}m {secs}s'
          else:
              dur_str = f'{duration:.0f}s'

          lines = [
              f"# Fork Sync Report",
              f"**perditioinc's GitHub Forks** \u00b7 {date_str} \u00b7 {dur_str}",
              "",
              "---",
              "",
              "## Summary",
              "| Status | Count |",
              "|--------|-------|",
              f"| Synced | {synced} |",
              f"| Checked | {checked} |",
              f"| Skipped (schedule) | {skipped} |",
              f"| Errors | {errors} |",
              "",
              "## Machine-readable fields",
              f"- date: {date_short}",
              f"- duration_seconds: {int(duration)}",
              f"- repos_checked: {checked}",
              f"- repos_synced: {synced}",
              f"- already_current: {checked - synced - errors}",
              f"- api_calls_used: {checked + synced}",
              f"- errors: {errors}",
              f"- skipped_schedule: {skipped}",
              "- peak_concurrency: 50",
              "- source: forksync v2 on Cloud Run",
              "",
              "---",
              "",
              "*Generated by [forksync v2](https://github.com/perditioinc/forksync) on Cloud Run*",
              "*Next run: tomorrow at 6am UTC*",
          ]
          report = "\n".join(lines) + "\n"

          with open('SYNC_REPORT.md', 'w') as f:
              f.write(report)

          print(f"SYNC_REPORT.md written: {synced} synced, {checked} checked, {duration:.0f}s")
          EOF

      - name: Commit SYNC_REPORT.md
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name 'forksync[bot]'
          git config user.email 'forksync[bot]@users.noreply.github.com'
          git add SYNC_REPORT.md
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: nightly sync report $(date -u +%Y-%m-%d)"
          git push
