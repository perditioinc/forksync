[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "forksync"
version = "2.0.0"
description = "Keep GitHub forks in sync at scale"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "google-cloud-firestore>=2.16",
    "redis>=5.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
forksync = "forksync.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["forksync*"]
